version: 2.1

jobs:
  backend:
    docker:
      - image: cimg/python:3.10
      - image: cimg/postgres:16.1
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: movies_rating
    environment:
      DJANGO_SETTINGS_MODULE: settings.docker
      # Django requires a key. This throwaway one only lives for the test run, so it can be public
      DJANGO_SECRET_KEY: ci-only-key-0123456789abcdef0123456789abcdef0123456789abcdef
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: postgres
    steps:
      - checkout
      - restore_cache:
          keys:
            - pip-v1-{{ checksum "requirements.txt" }}
      - run:
          name: Install dependencies
          command: pip install -r requirements.txt
      - save_cache:
          key: pip-v1-{{ checksum "requirements.txt" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Wait for Postgres
          command: dockerize -wait tcp://localhost:5432 -timeout 1m
      - run:
          name: Tests
          command: python manage.py test

  frontend:
    docker:
      - image: cimg/node:22.12.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "client/package-lock.json" }}
      - run:
          name: Install dependencies
          working_directory: client
          command: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "client/package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: ESLint
          working_directory: client
          command: npm run lint:check
      - run:
          name: Prettier
          working_directory: client
          command: npm run format:check
      - run:
          name: Build
          working_directory: client
          command: npm run build

workflows:
  checks:
    jobs:
      - backend
      - frontend

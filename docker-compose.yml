services:
  db:
    image: postgres:16.1
    env_file:
      .env
    ports:
      - 5433:5432
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis

  web:
    build: .
    image: movies_rating_web
    depends_on:
      - db
      - redis
    volumes:
      - .:/src
      - static:/static
    env_file:
      - .env

    command: /bin/bash -c "pip install -r requirements.txt && invoke runit"

  client:
    image: node:21.6.2
    volumes:
      - ./client:/src
    command: /bin/bash -c "cd /src/; npm i; npm run dev"
    ports:
      - 3000:3000

  nginx:
    image: nginx:1.25.4
    volumes:
      - static:/static:ro
      - ${NGINX_CONFIG:-./config/nginx.conf}:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - client
    ports:
      - "${NGINX_PORT:-8000}:80"
      - "${NGINX_SSL_PORT:-8443}:443"

volumes:
  pgdata:
  static: